name: Feature
description: Propose a registry, swarm, or CLI change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a swarm not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep FUTURE work (messaging, scores, delegation) explicitly labeled.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require storing private keys
          required: true
        - label: This does not claim to be an official Technocore component
          required: true
